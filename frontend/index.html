<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="매일의 할 일을 달성하고 나만의 식물을 키워보세요. 목표와 함께 성장하는 식물 키우기 투두앱, 하루한잎.">
    <link rel="icon" type="image/png" href="/assets/logo.png">
    <title>홈 - 하루한잎</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="dialog.css">
    <link rel="stylesheet" href="home.css">
</head>

<body>
    <div class="app-container">
        <div class="app-content">
            <header class="app-header">
                <div class="header-logo-row" style="display: flex; align-items: center; gap: 8px;">
                    <div style="width: 32px; height: 32px;"><img src="/assets/logo.png" alt="logo"
                            style="width:100%; height:100%; object-fit:contain;"></div>
                    <h1 style="font-size: 18px; margin: 0;">하루한잎</h1>
                </div>
            </header>

            <section class="home-section">
                <!-- 달력 카드 -->
                <div class="calendar-card">
                    <div class="calendar-header">
                        <button id="prev-month-btn" class="calendar-nav-btn">
                            <svg viewBox="0 0 16 16" fill="none">
                                <path d="M10 12L6 8L10 4" stroke="#2C4225" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                        </button>
                        <div class="calendar-title" id="current-month-label">2026년 7월</div>
                        <button id="next-month-btn" class="calendar-nav-btn">
                            <svg viewBox="0 0 16 16" fill="none">
                                <path d="M6 12L10 8L6 4" stroke="#2C4225" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                        </button>
                    </div>

                    <div class="calendar-weekdays">
                        <div class="weekday sun">일</div>
                        <div class="weekday">월</div>
                        <div class="weekday">화</div>
                        <div class="weekday">수</div>
                        <div class="weekday">목</div>
                        <div class="weekday">금</div>
                        <div class="weekday sat">토</div>
                    </div>

                    <div class="calendar-days" id="calendar-days">
                        <!-- JS에서 동적으로 렌더링 됨 -->
                    </div>
                </div>

                <!-- 할 일 섹션 -->
                <div>
                    <div class="todo-header">
                        <div class="todo-title-group">
                            <span class="todo-title" id="todo-date-title">7월 11일 할일</span>
                            <span class="todo-status" id="todo-status-label">0/0 완료</span>
                        </div>
                        <button class="btn-add-todo" id="add-todo-btn">
                            <svg viewBox="0 0 16 16" fill="none" style="width: 12px; height: 12px;">
                                <path d="M8 3V13M3 8H13" stroke="white" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            <span>추가</span>
                        </button>
                    </div>
                    <div class="todo-list-container" id="todo-list">
                        <!-- JS에서 동적으로 렌더링 됨 -->
                    </div>
                </div>
            </section>
        </div>
        <bottom-nav active="home"></bottom-nav>
    </div>
    <script src="dialog.js" defer></script>
    <script src="navigation.js" defer></script>
    <script src="home.js" defer></script>
</body>

</html>
