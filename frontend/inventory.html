<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인벤토리 - 하루한잎</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="inventory.css">
</head>
<body>
    <div class="app-container">
        <div class="app-content">
            <header class="app-header-with-subtitle">
                <h1>인벤토리</h1>
                <p>나의 식물 컬렉션</p>
            </header>
            
            <div id="current-plant-container">
                <!-- 현재 식물이 렌더링될 곳 -->
            </div>

            <!-- 수집된 식물 섹션 -->
            <section class="collection-section">
                <div class="collection-header">
                    <h2>수집된 식물</h2>
                    <span id="total-collection-count" class="collection-count">0 / 10</span>
                </div>

                <div id="collection-groups-container">
                    <!-- 등급별 도감이 렌더링될 곳 -->
                </div>
            </section>

            <!-- 획득 확률 안내 바 -->
            <div class="probability-info-bar">
                <span class="sparkle-icon">✦</span>
                <span>새로운 식물은 <strong class="common">일반 50%</strong> · <strong class="rare">희귀 30%</strong> · <strong class="epic">에픽 20%</strong> 확률로 만날 수 있어요!</span>
            </div>
        </div>
        <bottom-nav active="inventory"></bottom-nav>
    </div>
    <script src="navigation.js" defer></script>
    <script src="inventory.js" defer></script>
</body>
</html>
