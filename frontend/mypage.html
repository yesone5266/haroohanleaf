<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지 - 하루한잎</title>
    <link rel="stylesheet" href="common.css">
</head>
<body>
    <div class="app-container">
        <div class="app-content">
            <!-- 헤더 영역 -->
            <header class="app-header">
                <h1>마이페이지</h1>
            </header>

            <!-- 프로필 카드 -->
            <section class="card">
                <div class="profile-row">
                    <div class="profile-avatar">
                        <img src="http://localhost:3845/assets/5d60d52f139cff417abc1bbc546ec8f54ec813fd.png" alt="프로필 아바타">
                    </div>
                    <div class="profile-info">
                        <h2 class="profile-name">초록나무</h2>
                        <p class="profile-email">greenleaf@email.com</p>
                    </div>
                    <button class="btn-edit" aria-label="프로필 수정">
                        <img src="http://localhost:3845/assets/5d811760283642cb6370d09ee9f0dd84d6071f79.svg" alt="프로필 수정">
                    </button>
                </div>
                <p class="profile-bio">매일 조금씩 성장하는 중이에요 🌱</p>
            </section>

            <!-- 나의 기록 카드 -->
            <section class="card">
                <h2 class="record-title">나의 기록</h2>
                <div class="stat-grid">
                    <div class="stat-card">
                        <span class="stat-value">47</span>
                        <span class="stat-label">완료한 할일</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-value">3</span>
                        <span class="stat-label">수집한 식물</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-value">12일</span>
                        <span class="stat-label">연속 학습일</span>
                    </div>
                </div>
            </section>

            <!-- 액션 버튼 목록 -->
            <div class="action-list">
                <button class="btn-action logout">
                    <img src="http://localhost:3845/assets/b363bdc7492750f219a48f7f40e9e0537ce8a099.svg" alt="로그아웃">
                    <span>로그아웃</span>
                </button>
                <button class="btn-action delete">
                    <img src="http://localhost:3845/assets/acbd3bd55633a6c38be019462840baf04a0a1412.svg" alt="회원탈퇴">
                    <span>회원탈퇴</span>
                </button>
            </div>
        </div>

        <!-- 공통 바텀 네비게이션 컴포넌트 -->
        <bottom-nav active="mypage"></bottom-nav>
    </div>

    <!-- 공통 네비게이션 스크립트 연결 -->
    <script src="navigation.js" defer></script>
</body>
</html>
