<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 하루한잎</title>
    <link rel="stylesheet" href="common.css">
</head>

<body>
    <div class="app-container">
        <div class="login-content">
            <!-- 로고 및 서비스 정보 -->
            <div class="login-logo-container">
                <img src="/assets/logo.png" alt="하루한잎 로고" class="login-logo-img">
                <h1 class="login-title">하루한잎</h1>
                <p class="login-subtitle">매일 한 잎씩 성장하는 나</p>
            </div>

            <!-- 로그인 입력 폼 -->
            <form class="login-form" id="login-form" novalidate>
                <div class="form-field">
                    <label for="email" class="form-label">이메일</label>
                    <input type="email" id="email" class="form-input" placeholder="example@email.com" required
                        autocomplete="email">
                </div>
                <div class="form-field">
                    <label for="password" class="form-label">비밀번호</label>
                    <input type="password" id="password" class="form-input" placeholder="비밀번호 입력" required
                        autocomplete="current-password">
                </div>

                <p class="form-error-message" id="error-message" role="alert" aria-live="polite"></p>

                <button type="submit" class="btn-submit" id="submit-btn">로그인</button>
            </form>

            <!-- 회원가입 안내 -->
            <div class="signup-link-container">
                <span class="signup-link-text">계정이 없으신가요?</span>
                <a href="/register" class="btn-signup-link">회원가입</a>
            </div>
        </div>
    </div>
    <script src="login.js"></script>
</body>

</html>
